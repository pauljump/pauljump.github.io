<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paul Jump</title>
    <meta
      name="description"
      content="Paul Jump, applied AI systems and technical leadership."
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #18181b;
        background: #fafafa;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 40px));
      }

      p {
        margin: 0 0 18px;
        color: #52525b;
        font-size: 18px;
        line-height: 1.6;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(38px, 7vw, 72px);
        line-height: 1;
        letter-spacing: 0;
      }

      a {
        color: #111827;
        font-weight: 650;
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Paul Jump</h1>
      <p>Applied AI systems and technical leadership.</p>
      <a href="/case/">Read the applied AI case study</a>
    </main>
  </body>
</html>
